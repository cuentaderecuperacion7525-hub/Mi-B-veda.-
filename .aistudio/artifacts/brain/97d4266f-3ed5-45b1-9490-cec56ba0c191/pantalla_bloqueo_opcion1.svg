<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Cyber Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040810"/>
      <stop offset="35%" stop-color="#070e1c"/>
      <stop offset="70%" stop-color="#091322"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>

    <!-- Resplandor Ambiental Coral -->
    <radialGradient id="coralGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#F87171" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0"/>
    </radialGradient>

    <!-- Resplandor del Candado -->
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.04"/>
    </radialGradient>

    <!-- Filtro de Sombra Suave -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1080" height="1920" fill="url(#bgGrad)"/>
  
  <!-- Halo de Luz Coral Ambiental -->
  <circle cx="540" cy="940" r="700" fill="url(#coralGlow)"/>

  <!-- Anillos Cibernéticos Sutiles de Fondo (Marca de agua de seguridad) -->
  <g opacity="0.08" stroke="#00e5ff" fill="none" stroke-width="2">
    <circle cx="540" cy="920" r="480" stroke-dasharray="8 12"/>
    <circle cx="540" cy="920" r="360" stroke-width="1.5"/>
    <circle cx="540" cy="920" r="260" stroke-dasharray="20 10"/>
    <!-- Silueta de Escudo Faint -->
    <path d="M 540 680 L 680 740 C 680 920, 540 1060, 540 1060 C 540 1060, 400 920, 400 740 Z" stroke-width="3" stroke="#F87171" opacity="0.12"/>
  </g>

  <!-- Barra de Estado Móvil Superior -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#9AA7BD" opacity="0.75">
    <text x="70" y="90">1:45</text>
    <path d="M 920 66 L 945 92 L 895 92 Z" fill="#9AA7BD"/>
    <rect x="970" y="66" width="46" height="26" rx="6" fill="none" stroke="#9AA7BD" stroke-width="3"/>
    <rect x="974" y="70" width="22" height="18" rx="3" fill="#9AA7BD"/>
  </g>

  <!-- CONTENIDO CENTRALIZADO -->
  <g transform="translate(0, 0)">
    <!-- ÍCONO DE CANDADO SUPERIOR EN RECUADRO CORAL -->
    <!-- Fondo del recuadro redondeado -->
    <rect x="445" y="490" width="190" height="190" rx="44" 
          fill="rgba(248, 113, 113, 0.08)" 
          stroke="rgba(248, 113, 113, 0.55)" 
          stroke-width="3.5"/>

    <!-- Resplandor interno del recuadro -->
    <rect x="445" y="490" width="190" height="190" rx="44" fill="url(#badgeGlow)"/>

    <!-- Ícono de Candado Vectorial #F87171 -->
    <g transform="translate(540, 585)" stroke="#F87171" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)">
      <!-- Arco del Candado -->
      <path d="M -26 -4 L -26 -28 C -26 -44, 26 -44, 26 -28 L 26 -4"/>
      <!-- Cuerpo del Candado -->
      <rect x="-38" y="-4" width="76" height="58" rx="14" fill="#F87171" fill-opacity="0.25"/>
      <!-- Ojo de Cerradura -->
      <circle cx="0" cy="18" r="6" fill="#F87171"/>
      <path d="M 0 24 L 0 34"/>
    </g>

    <!-- TÍTULO: Intentos fallidos -->
    <text x="540" y="800" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="64" 
          font-weight="900" 
          fill="#FFFFFF" 
          letter-spacing="-1">
      Intentos fallidos
    </text>

    <!-- SUBTÍTULO: Por seguridad, tu bóveda se bloqueó temporalmente -->
    <text x="540" y="875" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-weight="500" 
          fill="#9AA7BD" 
          letter-spacing="0">
      Por seguridad, tu bóveda se bloqueó
    </text>
    <text x="540" y="925" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="34" 
          font-weight="500" 
          fill="#9AA7BD" 
          letter-spacing="0">
      temporalmente
    </text>

    <!-- ETIQUETA: INTENTA DE NUEVO EN -->
    <text x="540" y="1070" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="26" 
          font-weight="800" 
          fill="#64748B" 
          letter-spacing="6">
      INTENTA DE NUEVO EN
    </text>

    <!-- CUENTA REGRESIVA GIGANTE MONOESPACIADA #F87171 -->
    <text x="540" y="1220" 
          text-anchor="middle" 
          font-family="'SF Mono', 'Roboto Mono', 'Courier New', monospace" 
          font-size="140" 
          font-weight="900" 
          fill="#F87171" 
          letter-spacing="8"
          filter="url(#softGlow)">
      00:15
    </text>
  </g>

  <!-- PIE DE PANTALLA: Tus archivos siguen protegidos -->
  <g transform="translate(540, 1780)">
    <!-- Ícono de Escudo -->
    <path d="M -160 -18 L -140 -26 L -120 -18 C -120 0, -140 14, -140 14 C -140 14, -160 0, -160 -18 Z" 
          fill="none" 
          stroke="#475569" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    <path d="M -145 -4 L -140 2 L -134 -10" 
          fill="none" 
          stroke="#475569" 
          stroke-width="3" 
          stroke-linecap="round"/>

    <!-- Texto Tenue -->
    <text x="-95" y="0" 
          text-anchor="start" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="30" 
          font-weight="600" 
          fill="#475569" 
          letter-spacing="1">
      Tus archivos siguen protegidos
    </text>
  </g>
</svg>
