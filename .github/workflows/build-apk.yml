name: Compilar APK Android (Capacitor)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK de Android
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceptar licencias de Android SDK
        run: |
          yes | ($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || sdkmanager --licenses || true) 2>/dev/null || true

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Actualizar metadatos de version.json antes de compilar
        run: |
          BUILD_NUM=${{ github.run_number }}
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          node -e "
            const fs = require('fs');
            let targetVersion = '1.0.0';
            let existingChangelog = [];
            try {
              const currentJson = JSON.parse(fs.readFileSync('public/version.json', 'utf8'));
              if (currentJson.version_name || currentJson.version) {
                targetVersion = (currentJson.version_name || currentJson.version).replace(/^v/, '');
              }
              if (Array.isArray(currentJson.changelog) && currentJson.changelog.length > 0) {
                existingChangelog = currentJson.changelog;
              }
            } catch (e) {}

            const newVersionName = targetVersion;
            const newVersionCode = 1;
            const repo = process.env.GITHUB_REPOSITORY || 'cuentaderecuperacion7525-hub/Mi-B-veda.-';

            if (existingChangelog.length === 0) {
              existingChangelog = [
                'Lanzamiento oficial v1.0.0 de Bóveda Segura con suite de protección completa.'
              ];
            }
            const data = {
              version: newVersionName,
              version_name: newVersionName,
              buildNumber: newVersionCode,
              version_code: newVersionCode,
              download_url: 'https://github.com/' + repo + '/releases/latest/download/Boveda-Calculadora.apk',
              releaseDate: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }),
              changelog: existingChangelog,
              mandatory: false
            };
            fs.writeFileSync('public/version.json', JSON.stringify(data, null, 2));

            const tsCode = 'export interface VersionInfo {\n  version: string;\n  buildNumber: number;\n  releaseDate: string;\n  changelog: string[];\n  mandatory?: boolean;\n}\n\n' +
              'export const CURRENT_APP_VERSION = \'' + newVersionName + '\';\n' +
              'export const CURRENT_BUILD_NUMBER = ' + newVersionCode + ';\n' +
              'export const CURRENT_RELEASE_DATE = \'' + data.releaseDate + '\';\n\n' +
              'export const CURRENT_CHANGELOG: string[] = ' + JSON.stringify(data.changelog, null, 2) + ';\n\n' +
              'export const APP_VERSION_METADATA: VersionInfo = {\n  version: CURRENT_APP_VERSION,\n  buildNumber: CURRENT_BUILD_NUMBER,\n  releaseDate: CURRENT_RELEASE_DATE,\n  changelog: CURRENT_CHANGELOG,\n  mandatory: false\n};\n\n' +
              'export const APP_VERSION = CURRENT_APP_VERSION;\n' +
              'export default APP_VERSION;\n';
            fs.writeFileSync('src/version.ts', tsCode);

            const githubEnv = process.env.GITHUB_ENV;
            if (githubEnv) {
              fs.appendFileSync(githubEnv, 'NEW_VERSION_NAME=' + newVersionName + '\n');
              fs.appendFileSync(githubEnv, 'NEW_VERSION_CODE=' + newVersionCode + '\n');
            }
          "
        env:
          BUILD_NUM: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar proyecto Android
        run: |
          npx cap sync android

      - name: Configurar firma fija para evitar conflicto de paquete
        run: |
          # Si por alguna razon no esta el archivo, generar el keystore permanente del proyecto con keytool
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generando debug.keystore permanente con keytool..."
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi
          # Sincronizar versionCode y versionName en android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/g" android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"$NEW_VERSION_NAME\"/g" android/app/build.gradle || true

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo APK final
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/*.apk apk-output/Boveda-Calculadora-v${{ env.NEW_VERSION_NAME }}.apk
          cp android/app/build/outputs/apk/debug/*.apk apk-output/Boveda-Calculadora.apk
          ls -la apk-output/

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Boveda-Calculadora-v${{ env.NEW_VERSION_NAME }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release publica en GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v${{ env.NEW_VERSION_NAME }}"
          name: "Mi Bóveda v${{ env.NEW_VERSION_NAME }}"
          body: "Lanzamiento oficial de Mi Bóveda (v${{ env.NEW_VERSION_NAME }}) con suite de protección completa."
          draft: false
          prerelease: false
          files: |
            apk-output/Boveda-Calculadora-v${{ env.NEW_VERSION_NAME }}.apk
            apk-output/Boveda-Calculadora.apk
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
