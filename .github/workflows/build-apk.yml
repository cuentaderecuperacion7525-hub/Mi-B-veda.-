name: Compilar APK Android (Capacitor)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generar APK de Android
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Aceptar licencias de Android SDK
        run: |
          yes | ($ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || sdkmanager --licenses || true) 2>/dev/null || true

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Actualizar metadatos de version.json antes de compilar
        run: |
          BUILD_NUM=${{ github.run_number }}
          NEW_VERSION_CODE=$((100 + BUILD_NUM))
          echo "Generando public/version.json con build $BUILD_NUM (version_code $NEW_VERSION_CODE)..."
          node -e "
            const fs = require('fs');
            const data = {
              version: '1.0.' + process.env.BUILD_NUM,
              version_name: '1.0.' + process.env.BUILD_NUM,
              buildNumber: parseInt(process.env.NEW_VERSION_CODE, 10),
              version_code: parseInt(process.env.NEW_VERSION_CODE, 10),
              download_url: 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/releases/latest/download/Boveda-Calculadora.apk',
              releaseDate: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }),
              changelog: [
                'Compilación automática #' + process.env.BUILD_NUM + ' generada en GitHub.',
                'Actualización del sistema sin pérdida de fotos, videos ni notas.'
              ],
              mandatory: false
            };
            fs.writeFileSync('public/version.json', JSON.stringify(data, null, 2));
          "
        env:
          BUILD_NUM: ${{ github.run_number }}
          NEW_VERSION_CODE: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar proyecto Android
        run: |
          npx cap sync android

      - name: Configurar firma fija para evitar conflicto de paquete
        run: |
          # Si por alguna razon no esta el archivo, restaurar el keystore permanente del proyecto
          if [ ! -f android/app/debug.keystore ]; then
            echo "Restaurando debug.keystore permanente para firma identica..."
            echo "" | base64 -d > android/app/debug.keystore
          fi
          # Incrementar versionCode de forma ascendente garantizada (mínimo 100 + run_number)
          # para que Android siempre reconozca la actualización sin error de conflicto
          BUILD_NUM=${{ github.run_number }}
          NEW_VERSION_CODE=$((100 + BUILD_NUM))
          sed -i "s/versionCode [0-9]*/versionCode $NEW_VERSION_CODE/g" android/app/build.gradle || true
          sed -i "s/versionName \".*\"/versionName \"1.0.$BUILD_NUM\"/g" android/app/build.gradle || true

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar archivo APK final
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/debug/*.apk apk-output/Boveda-Calculadora-v1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/debug/*.apk apk-output/Boveda-Calculadora.apk
          ls -la apk-output/

      - name: Subir APK a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Boveda-Calculadora-v1.0.${{ github.run_number }}
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release publica en GitHub
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Boveda v1.0.${{ github.run_number }}"
          body: "Compilacion automatica de Android #${{ github.run_number }} con actualizacion del sistema."
          draft: false
          prerelease: false
          files: |
            apk-output/Boveda-Calculadora-v1.0.${{ github.run_number }}.apk
            apk-output/Boveda-Calculadora.apk
            public/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
