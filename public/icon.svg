<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#131c2e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer shield contour -->
  <path d="M256 64 L416 128 V272 C416 368 348 424 256 464 C164 424 96 368 96 272 V128 Z" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Inner shield highlight -->
  <path d="M256 96 L384 148 V264 C384 340 330 388 256 424 C182 388 128 340 128 264 V148 Z" fill="#0f172a" opacity="0.9" />

  <!-- Padlock body -->
  <rect x="192" y="240" width="128" height="104" rx="24" fill="url(#accentGrad)" />

  <!-- Padlock shackle -->
  <path d="M216 240 V200 C216 178 234 160 256 160 C278 160 296 178 296 200 V240" fill="none" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />

  <!-- Padlock keyhole -->
  <circle cx="256" cy="284" r="10" fill="#090d16" />
  <path d="M251 288 L261 288 L263 312 L249 312 Z" fill="#090d16" />
</svg>
